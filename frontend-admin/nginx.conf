# /nginx.conf
# This configuration is specifically for serving a Vue.js Single Page Application.

# Map to determine the value of the 'Connection' header based on the 'Upgrade' header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
  # Listen on the default port 80 inside the container
  listen 80;

  # Set the root directory to where our Vue app's files are
  root /usr/share/nginx/html;

  # This is the crucial part for SPAs.
  # It tries to find a file matching the request URI.
  # If it can't find a file or a directory, it falls back to serving /index.html.
  # This allows Vue Router to handle all the page routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # NOTE (Phase 9): the legacy direct proxy to the backend ("app:8080") was
  # removed. In the current architecture the browser never sends /api/ to this
  # container — the central reverse proxy routes /api/ to the backend, and the
  # SPA calls the API same-origin via config.js. Keeping an upstream reference
  # to "app" here would hard-fail nginx at start when the frontend runs on the
  # edge network only (Phase 9 network isolation), where "app" is
  # intentionally not resolvable.

  # Optional: Add headers to prevent caching of index.html,
  # ensuring users get the latest version of the app.
  location = /index.html {
    add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    expires off;
  }
}