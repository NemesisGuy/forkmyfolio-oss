<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="description" content="ForkMyFolio - The ultimate developer portfolio builder." />
    <!-- SEO v3.1.2: the Vue SPA serves only auth/admin/manage routes (the nginx
         proxy routes everything public to the Nuxt SSR app) — never index it. -->
    <meta name="robots" content="noindex, nofollow" />
      <link rel="icon" href="/favicon.ico" />

    <!-- Bootstrap Icons (Already here) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- ADD: Font Awesome for brand icons like Java, Python, etc. -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- ADD: Devicon for a huge collection of programming language & tool icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css"
    />

    <title>ForkMyFolio</title>
    <!-- Runtime configuration injected by Docker at startup -->
    <script type="text/javascript" src="/config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
