# ForkMyFolio reverse-proxy main configuration.
#
# Phase 0.21: this file replaces the stock nginx image's nginx.conf. It is
# byte-equivalent to the stock one EXCEPT for the capacity block, which could
# not live in conf.d templates (main/events context is out of scope for
# included files):
#
#   worker_rlimit_nofile 65535 — every proxied request holds TWO fds
#     (client + upstream); the stock image gave the container no explicit
#     rlimit and under load tests nginx died with
#     "accept4() failed (24: No file descriptors available)" and served
#     instant 500s to every client, healthy upstreams or not.
#
#   worker_connections 8192 (stock: 1024) — hard ceiling of concurrent
#     connection slots per worker; with ~2 slots per proxied request the
#     stock value allowed ~500 requests in flight platform-wide.
#
#   multi_accept on — under a connection storm, accept the whole backlog
#     queue per readiness event instead of one connection per event.
#
# Keep in sync with the upstream keepalive settings in
# templates/default.conf.template.* (keepalive pools + proxy_set_header
# Connection "") — tuning fds without reusing upstream sockets would still
# churn the kernel's connection table.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  8192;
    multi_accept        on;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;

    keepalive_timeout  65;

    # Phase 0.22: response compression. The 99 KB portfolio JSON transfers
    # raw at ~7x its wire cost and saturated the test path at ~65 RPS while
    # the upstream stack stayed healthy (0% errors, 100% cache hits).
    # gzip turns the wire payload into ~12-15 KB for this content class,
    # raising the same pipe to a few hundred req/s. Levels: 5 = sweet spot
    # (deflate is far cheaper than the transfer it saves for JSON).
    # gzip_proxied any is REQUIRED here — default omits compressed responses
    # coming from upstream proxies/containers, which is ALL of our traffic.
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     5;
    gzip_min_length     1024;
    gzip_types          application/json application/javascript application/xml
                        text/css text/plain text/javascript;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
