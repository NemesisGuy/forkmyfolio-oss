name: Bug report
description: Report a problem with ForkMyFolio
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the details below.
        **Do not include secrets, passwords, or tokens in this report.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - backend (Spring Boot API)
        - frontend-admin (Vue dashboard)
        - frontend-public (Nuxt site)
        - proxy / docker-compose deployment
        - documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The release, tag, or commit you are running.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Redact any credentials before pasting.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, browser if relevant.
