name: Public Frontend CI

on:
  push:
    paths: ["frontend-public/**", ".github/workflows/frontend-public-ci.yml"]
  pull_request:
    paths: ["frontend-public/**", ".github/workflows/frontend-public-ci.yml"]

defaults:
  run:
    working-directory: frontend-public

jobs:
  test-and-build:
    name: Install + tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-public/package-lock.json

      - name: Install (lockfile-based)
        run: npm ci --no-audit --no-fund

      - name: Unit + SSR tests
        run: npm test

      - name: Production build
        run: npm run build
