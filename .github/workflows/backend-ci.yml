name: Backend CI

on:
  workflow_dispatch:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  build-and-unit-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build (skip tests)
        run: mvn -B -ntp package -DskipTests

      - name: Unit tests (Testcontainers integration tests excluded)
        # Integration tests (*IntegrationTest) require Docker + MySQL via
        # Testcontainers and are intentionally excluded from this fast gate.
        run: mvn -B -ntp test -Dtest='!*IntegrationTest' -DfailIfNoTests=false
