name: Admin Frontend CI

on:
  push:
    paths: ["frontend-admin/**", ".github/workflows/frontend-admin-ci.yml"]
  pull_request:
    paths: ["frontend-admin/**", ".github/workflows/frontend-admin-ci.yml"]

defaults:
  run:
    working-directory: frontend-admin

jobs:
  test-and-build:
    name: Install + unit tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install (lockfile-based)
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Production build
        run: npm run build
